# 週次 競合ニュース自動収集＋Slack通知（恒久運用版）
#
# ★有効化に必要な準備（未設定だと動きません）:
#   1. リポジトリ Settings > Secrets and variables > Actions に ANTHROPIC_API_KEY を登録
#   2. Slack通知を使う場合は Secret に SLACK_WEBHOOK_URL を登録
#        （Slack管理画面 > Incoming Webhooks で投稿先チャンネルのURLを発行）
#   3. ダッシュボードURLを差し替える場合は Variables に DASHBOARD_URL を登録（任意）
#   4. Settings > Actions > General > Workflow permissions を "Read and write" に
#   5. 下の action バージョン/入力は環境に合わせて要確認（初回は手動実行で検証）
#
# 動作: 毎週月曜 09:12(JST) に競合(住友不動産)のニュースをWeb収集し、
#       templates/mec-h_sumitomo.csv に追記してコミット&プッシュ。
#       そのうえで最新週の「変化点サマリー＋ダッシュボードのリンク」をSlackへ自動投稿する。
#
# ※ Claude Code のセッション内 cron はセッション終了で消えるため、
#    「本当に毎週勝手に動く」運用はこちら(GitHub Actions)が本命です。

name: weekly-competitive-collect

on:
  schedule:
    - cron: "12 0 * * 1"   # UTC 00:12 Mon = JST 09:12 Mon
  workflow_dispatch:        # 手動実行も可（初回テスト用）

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/capture-tool-refinement-ye1rbk

      - name: Run collector (Claude Code Action)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Web検索を許可（アクションのバージョンによりオプション名は要確認）
          allowed_tools: "WebSearch,WebFetch,Read,Edit,Write"
          prompt: |
            三菱地所ハウスネット向けの競合ウォッチ週次収集。競合は「住友不動産」のみ
            (不動産仲介ブランド=住友不動産ステップ／住友不動産販売を含む)。
            直近1週間の新しいニュース・プレスリリース・新サービス・料金改定・キャンペーン・
            店舗開設・ブランド施策をWeb検索で収集する。不動産売買仲介の動きを優先し、採用・IRは除外。
            templates/mec-h_sumitomo.csv のスキーマ
            (週,カテゴリ,競合,媒体,重要度,日付,タイトル,先週,今週,AIメモ,入札上昇,入札下落,ネクストアクション,社外価値)
            に沿って新しい行を追記。競合列は常に「住友不動産」。BOM付きUTF-8を維持。カテゴリは基本「ニュース」、
            重要度は高/中/低、AIメモに必ず(出典: 媒体名)を付ける。事実のみ・推測は(推測)と明示。
            値にASCIIカンマは使わない(全角・スラッシュで代替)。週の値は実行日(今週)ベース。
            新規性がなければファイルは変更しない。

      - name: Commit & push
        run: |
          git config user.name "competitive-bot"
          git config user.email "competitive-bot@users.noreply.github.com"
          if ! git diff --quiet -- templates/mec-h_sumitomo.csv; then
            git add templates/mec-h_sumitomo.csv
            git commit -m "週次自動収集(住友不動産): $(date +%Y-%m-%d)"
            git push
          else
            echo "変更なし（今週の新規なし）"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Post weekly digest to Slack
        if: ${{ always() }}   # 収集に新規が無くても週次ダイジェストは投稿する
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL 未設定のためSlack投稿をスキップ（ドライラン）"
          fi
          node templates/slack_digest.mjs templates/mec-h_sumitomo.csv
